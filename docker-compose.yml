services:
  postgres:
    image: postgres:16-alpine
    container_name: authcore-postgres
    environment:
      POSTGRES_USER: authcore
      POSTGRES_PASSWORD: authcore_secret
      POSTGRES_DB: authcore_test
    ports:
      - '5433:5432'
    volumes:
      - authcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authcore -d authcore_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authcore-postgres-data:
